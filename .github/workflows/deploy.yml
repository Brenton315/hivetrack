name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build -- --base=/hivetrack/
        env:
          VITE_SUPABASE_URL: https://puhxlfitwbvmzlbnzrhr.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1aHhsZml0d2J2bXpsYm56cmhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMjEzMDYsImV4cCI6MjEwMzY5NzMwNn0.PQFuIrpIvBnm7kGQ5EhZKrEq1YbQBQ-5Qc4biqPOn-g

      - name: SPA routing fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
